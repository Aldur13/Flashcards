name: Apply Supabase SQL

# Kör SQL-filen mot databasen via Supabase Management API.
# Använder samma hemlighet som edge-funktionerna: SUPABASE_ACCESS_TOKEN (sbp_...).
# Därför behövs ingen SQL Editor. Starta manuellt under Actions -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/website-launch-setup-u4g39j
      - main
    paths:
      - "supabase/v4.4-shared-cards.sql"
      - ".github/workflows/apply-sql.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run v4.4-shared-cards.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Saknar SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          jq -Rs '{query: .}' supabase/v4.4-shared-cards.sql > body.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/cicxvhjydsmgnysbkjlu/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json)
          echo "HTTP $code"
          cat resp.txt
          case "$code" in 2*) echo "Klart." ;; *) echo "::error::SQL misslyckades"; exit 1 ;; esac
