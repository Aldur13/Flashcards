name: Deploy SambaNova proxy

on:
  workflow_dispatch:
  push:
    branches:
      - claude/website-launch-setup-u4g39j
    paths:
      - "supabase/functions/sambanova-proxy/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-sambanova.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 0
          fi
          npx --yes supabase@latest functions deploy sambanova-proxy --project-ref cicxvhjydsmgnysbkjlu --no-verify-jwt
