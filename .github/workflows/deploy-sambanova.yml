name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - claude/website-launch-setup-u4g39j
    paths:
      - "supabase/functions/sambanova-proxy/**"
      - "supabase/functions/api-keys-vault/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-sambanova.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN. Create a Supabase Personal Access Token (format sbp_...) and save it as a GitHub Actions repository secret."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "Supabase token format looks valid." ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN has the wrong format. The Supabase CLI expects a Personal Access Token beginning with sbp_. Create one in Supabase Account > Access Tokens, replace the GitHub Actions secret, and rerun this workflow."
              exit 1
              ;;
          esac
      - name: Deploy SambaNova proxy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy sambanova-proxy --project-ref cicxvhjydsmgnysbkjlu --no-verify-jwt --yes
      - name: Deploy encrypted account API-key vault
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy api-keys-vault --project-ref cicxvhjydsmgnysbkjlu --no-verify-jwt --yes
